name: Content quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  content:
    name: Routes, links, metadata, and MDX
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/content-quality/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/content-quality/package-lock.json
      - run: python -m pip install -r tests/content-quality/requirements.txt
      - run: npm ci --prefix tests/content-quality --ignore-scripts --no-audit --no-fund
      - name: Test the validators
        run: python -m unittest discover -s tests/content-quality -p 'test_*.py'
      - name: Check managed and changed source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python hugo/scripts/check_content.py --base "$BASE_SHA" --write-mdx-list "$RUNNER_TEMP/mdx-scope.json"
      - name: Compile the checked MDX scope
        run: node hugo/scripts/check_mdx.mjs "$RUNNER_TEMP/mdx-scope.json"
      - name: Check static example links
        run: python hugo/scripts/check_examples.py static

  examples:
    name: Example / ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        example: [nodejs, github-actions, tailwind, scikit-learn]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: static/examples/scikit-learn/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.example != 'scikit-learn'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/examples/tailwind/package-lock.json
      - name: Run project in a clean temporary directory
        env:
          EXAMPLE_ID: ${{ matrix.example }}
        run: python hugo/scripts/check_examples.py "$EXAMPLE_ID"

  browser:
    name: Frontend example interactions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/content-quality/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: npm ci --prefix tests/content-quality --ignore-scripts --no-audit --no-fund
      - run: npx --prefix tests/content-quality playwright install --with-deps chromium
      - run: npm --prefix tests/content-quality run test:browser
      - name: Learning and playground regression fixtures
        env:
          CNR_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tests/content-quality/node_modules/playwright
          NODE_PATH: ${{ github.workspace }}/tests/content-quality/node_modules
        run: node --test --test-concurrency=1 tests/learning.spec.js tests/playground.spec.js tests/accounts.spec.js tests/profile.spec.js

      - name: Account API regression tests
        run: node --test tests/accounts-*.test.mjs tests/auth-security.test.mjs
