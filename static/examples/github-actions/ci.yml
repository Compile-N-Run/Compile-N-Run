# Teaching file: activate only in your own practice repository by placing this
# at .github/workflows/ci.yml with the accompanying package and tests at its root.
# Action pins resolved from official v7 tags on 2026-10-15; review updates regularly.
name: Minimal Node CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prepare reports
        run: mkdir -p reports
      - name: Run tests
        id: tests
        run: node --test --test-reporter=tap > reports/tests.tap
      - name: Retain test report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-node-${{ matrix.node }}
          path: reports/tests.tap
          if-no-files-found: error
          retention-days: 7
