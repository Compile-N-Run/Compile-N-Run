# Group the existing course menus from docusaurus.config.js without duplicating links.
# A category may also define its own groups under `links`.
categories:
  - label: Fundamentals
    groups: [Fundamentals]
  # Interview has no Docusaurus dropdown; its groups are defined here (same label/to fields).
  - label: Interview
    note: Practice the LeetCode questions companies ask.
    links:
      - label: Practice
        items:
          - {label: Questions by company, to: /interview/}
          - {label: Most asked overall, to: /interview/most-asked/}
          - {label: Learn by topic, to: /interview/topics/}
          - {label: Study plans, to: /interview/plans/}
          - {label: All problems (by number), to: /interview/problems/}
          - {label: Interview preparation guide, to: /docs/fundamental/interview/}
      - label: Popular companies
        items:
          - {label: Google, to: /interview/company/google/}
          - {label: Amazon, to: /interview/company/amazon/}
          - {label: Meta, to: /interview/company/meta/}
          - {label: Microsoft, to: /interview/company/microsoft/}
          - {label: Bloomberg, to: /interview/company/bloomberg/}
          - {label: Uber, to: /interview/company/uber/}
          - {label: TikTok, to: /interview/company/tiktok/}
          - {label: Oracle, to: /interview/company/oracle/}
  - label: Languages
    groups: [Languages]
  - label: Web
    groups: [Web]
  - label: Data & AI
    groups: [Databases, Data & AI]
  - label: DevOps & Systems
    groups: [DevOps, Linux, Middleware, Observability]
  - label: Mobile & IoT
    groups: [Mobile, IoT]
