# Learning roadmaps shown on /roadmap/ (layouts/roadmap/single.html).
#
# Each track is a list of stages, top to bottom; each stage is a row of nodes. A node points at one of:
#   tut:     a tutorial folder under docs/ (e.g. language/python)
#   section: a section folder under docs/ (e.g. language/python/14-python-data-science)
#   page:    a single page under docs/, without the extension
#   missing: true  -- a topic Compile N Run has no tutorial for yet (shown dashed; "note" explains it)
#   track:   another track's id, shown as a link to that roadmap
# "from" lists the ids of the nodes it builds on (arrows are drawn from them). Without "from", a node
# builds on every node of the stage above it. "title" overrides the tutorial/section title.

tracks:
  - id: foundations
    title: Foundations
    blurb: Where everyone starts. Learn one language well, then the computer-science basics every developer relies on.
    stages:
      - nodes:
          - { id: python, tut: language/python, title: Python, note: "The friendliest first language." }
          - { id: javascript, tut: language/javascript, title: JavaScript, note: "The language of the web." }
      - nodes:
          - { id: terminal, section: os/ubuntu/2-ubuntu-terminal, title: The command line }
          - { id: git, tut: devops/git, title: Git }
      - nodes:
          - { id: dsa, tut: fundamental/algorithm, title: Data structures & algorithms }
          - { id: sql, tut: language/sql, title: SQL }
      - nodes:
          - { id: comparch, missing: true, title: How computers work, note: "CPU, memory, binary and how code becomes machine instructions." }
          - { id: os, tut: fundamental/os, title: Operating systems, from: [dsa, comparch] }
          - { id: network, tut: fundamental/network, title: Computer networks, from: [dsa] }
          - { id: databases, tut: fundamental/database, title: Databases & information systems, from: [sql] }
      - nodes:
          - { id: discrete, missing: true, title: Discrete math for programmers, note: "Logic, sets, counting and graphs: the math behind algorithms.", from: [dsa] }
          - { id: arch, tut: fundamental/architecture, title: Software architecture & design patterns, from: [os, databases] }
          - { id: security, tut: fundamental/security, title: Cybersecurity, from: [network] }
      - nodes:
          - { id: interview, tut: fundamental/interview, title: Interview preparation, from: [arch, security, discrete] }
      - nodes:
          - { id: next-frontend, track: frontend, from: [interview] }
          - { id: next-backend, track: backend, from: [interview] }
          - { id: next-devops, track: devops, from: [interview] }
          - { id: next-data, track: data-ai, from: [interview] }

  - id: frontend
    title: Frontend
    blurb: Build what people see and use in the browser, from plain HTML to production React and Next.js apps.
    stages:
      - nodes:
          - { id: html, tut: language/html, title: HTML, note: "Page structure, forms, semantic elements." }
          - { id: css, tut: language/css, title: CSS, note: "Selectors, the box model, Flexbox, Grid and responsive design." }
      - nodes:
          - { id: js, tut: language/javascript, title: JavaScript }
      - nodes:
          - { id: dom, section: language/javascript/8-javascript-dom-manipulation, title: The DOM }
          - { id: browser, section: language/javascript/9-javascript-browser-apis, title: Browser APIs }
          - { id: ts, tut: language/typescript, title: TypeScript }
      - nodes:
          - { id: git, tut: devops/git, title: Git, from: [dom, browser] }
          - { id: modules, section: language/javascript/10-javascript-modules, title: Modules, npm & bundlers, from: [dom, browser, ts] }
          - { id: tailwind, tut: framework/tailwind, title: Tailwind CSS, note: "Utility classes, responsive layouts, themes, and component states.", from: [] }
      - nodes:
          - { id: react, tut: framework/react, title: React, from: [modules] }
          - { id: vue, tut: framework/vue, title: Vue.js, from: [modules] }
          - { id: angular, tut: framework/angular, title: Angular, from: [modules] }
      - nodes:
          - { id: nextjs, tut: framework/nextjs, title: Next.js, from: [react] }
          - { id: testing, section: language/javascript/14-javascript-testing, title: Frontend testing, from: [react, vue, angular] }
          - { id: a11y, tut: fundamental/web-accessibility, title: Web accessibility, note: "Making sites usable with screen readers and keyboards (WCAG).", from: [react, vue, angular] }
      - nodes:
          - { id: perf, section: language/javascript/15-javascript-performance, title: Web performance, from: [nextjs, testing] }
          - { id: websec, section: fundamental/security/3-sec-web-security, title: Web security, from: [nextjs, testing] }
          - { id: next-backend, track: backend, from: [nextjs] }

