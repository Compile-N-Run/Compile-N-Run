          - { id: go, tut: language/go, title: Go }
          - { id: js, tut: language/javascript, title: JavaScript }
          - { id: csharp, tut: language/c-sharp, title: "C#" }
          - { id: php, tut: language/php, title: PHP }
      - nodes:
          - { id: django, tut: framework/django, title: Django, from: [python] }
          - { id: flask, tut: framework/flask, title: Flask, from: [python] }
          - { id: fastapi, tut: framework/fastapi, title: FastAPI, from: [python] }
          - { id: spring, tut: framework/spring, title: Spring, from: [java] }
          - { id: gin, tut: framework/gin, title: Gin, from: [go] }
          - { id: echo, tut: framework/echo, title: Echo, from: [go] }
          - { id: nodejs, tut: framework/nodejs, title: Node.js, note: "The runtime itself: the event loop, modules, files and streams.", from: [js] }
          - { id: dotnet, tut: framework/dotnet, title: .NET, from: [csharp] }
