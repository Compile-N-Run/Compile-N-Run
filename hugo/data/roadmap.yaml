          - { id: mysql, tut: database/mysql, title: MySQL, from: [sql] }
          - { id: mongodb, tut: database/mongodb, title: MongoDB, from: [] }
      - nodes:
          - { id: apis, section: fundamental/architecture/10-arch-integration-and-apis, title: API design, from: [postgres, mysql, mongodb] }
          - { id: graphql, missing: true, title: GraphQL, note: "Schema-first APIs that clients query for exactly the data they need.", from: [postgres, mysql, mongodb] }
          - { id: auth, section: fundamental/security/4-sec-authentication, title: Authentication & authorization, from: [postgres, mysql, mongodb] }
      - nodes:
          - { id: redis, tut: middleware/redis, title: Redis caching, from: [apis] }
          - { id: rabbitmq, tut: middleware/rabbitmq, title: RabbitMQ, from: [apis] }
          - { id: kafka, missing: true, title: Kafka, note: "Event streaming for high-volume, durable message pipelines.", from: [apis] }
          - { id: search, missing: true, title: Elasticsearch, note: "Full-text search and log analytics.", from: [apis] }
          - { id: nginx, tut: middleware/nginx, title: Nginx, from: [apis, auth] }
          - { id: kong, tut: middleware/kong, title: Kong API gateway, from: [nginx] }
      - nodes:
          - { id: docker, tut: devops/docker, title: Docker, from: [redis, rabbitmq, nginx] }
          - { id: arch, tut: fundamental/architecture, title: Architecture & design patterns, from: [redis, rabbitmq, kafka] }
          - { id: distributed, section: fundamental/architecture/9-arch-distributed-systems, title: Distributed systems, from: [kafka, rabbitmq] }
      - nodes:
