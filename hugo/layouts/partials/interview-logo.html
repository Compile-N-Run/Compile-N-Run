{{- /* Company logo tile, or a coloured initial when we have no logo. Context: dict "slug" "name" "size" (sm|md|lg). */ -}}
{{- $logos := site.Data.interview.logos }}
{{- $size := .size | default "md" }}
{{- if in $logos .slug -}}
<span class="cnr-iv-logo cnr-iv-logo--{{ $size }}"><img src="/img/companies/{{ .slug }}.png" alt="" width="64" height="64" loading="lazy" decoding="async"></span>
{{- else -}}
<span class="cnr-iv-logo cnr-iv-logo--{{ $size }} cnr-iv-logo--initial cnr-iv-logo--c{{ mod (hash.FNV32a .slug) 6 }}" aria-hidden="true">{{ substr (upper .name) 0 1 }}</span>
{{- end -}}
