{{- /* Pug inline text: escape it and mark #{…} / !{…} interpolations and quoted strings. */ -}}
{{- $s := htmlEscape . -}}
{{- $s = replaceRE `([#!]\{[^}]*\})` `<span class="si">$1</span>` $s -}}
{{- $s = replaceRE `(&#34;[^&]*?&#34;|&#39;[^&]*?&#39;)` `<span class="s">$1</span>` $s -}}
{{- return $s -}}
