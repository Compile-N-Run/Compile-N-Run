{{- /* Search dialog opened by the navbar DocSearch button or Ctrl/Cmd+K, backed by Pagefind. */ -}}
{{- $b := site.Params.pagefindBundle | default "/pagefind/" }}
<dialog class="cnr-find-dialog" data-search-modal aria-labelledby="cnr-search-title">
  <div class="cnr-find__heading"><h2 id="cnr-search-title">Search Compile N Run</h2><button type="button" class="clean-btn" data-search-close aria-label="Close search">×</button></div>
  <div data-find-root data-bundle="{{ $b }}">{{ partial "search-controls.html" (dict "prefix" "modal-search") }}</div>
  <div class="cnr-search__footer">Powered by Pagefind · <kbd>Esc</kbd> to close</div>
</dialog>
