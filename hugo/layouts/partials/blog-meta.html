{{- /* Docusaurus' reading time: 200 words per minute, rounded up. */ -}}
{{- $min := math.Max 1 (math.Ceil (div (float .WordCount) 200)) -}}
<div class="container_mt6G margin-vert--md"><time datetime="{{ .Date.UTC.Format "2006-01-02T15:04:05.000Z" }}">{{ .Date.Format "January 2, 2006" }}</time> · {{ if eq $min 1.0 }}One min read{{ else }}{{ $min }} min read{{ end }}</div>
