{{- /* Pug attribute list "(name=value, …)": names as attributes, quoted values as strings. */ -}}
{{- $s := htmlEscape . -}}
{{- $s = replaceRE `([(,\s])([\w:@.-]+)(=|[,)\s])` `$1<span class="na">$2</span>$3` $s -}}
{{- $s = replaceRE `(&#34;[^&]*?&#34;|&#39;[^&]*?&#39;)` `<span class="s">$1</span>` $s -}}
{{- return $s -}}
