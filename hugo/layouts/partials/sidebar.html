{{- /* Rendered once per tutorial (partialCached by tutorial dir); the active link is marked in JS. */ -}}
{{- $root := site.GetPage (printf "/docs/%s" .dir) -}}
<nav class="sidebar-nav" aria-label="{{ .label }}">
  <a class="sidebar-title" href="{{ .url }}">{{ .label }}</a>
  {{- with $root }}
  {{ partial "tree.html" . }}
  {{- end }}
</nav>
