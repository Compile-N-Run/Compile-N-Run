{{- $groups := partialCached "groups.html" . }}
<header class="topbar">
  <button class="icon-btn menu-btn" aria-label="Open navigation" data-toggle-sidebar>☰</button>
  <a class="brand" href="/">
    <img src="/img/logo.png" alt="" width="28" height="28">
    <span>Compile N Run</span>
  </a>
  <nav class="topnav" aria-label="Tutorials">
    {{- range $groups }}
    <details class="dropdown">
      <summary>{{ .label }}</summary>
      <div class="dropdown-menu">
        {{- range .tutorials }}
        <a href="{{ .url }}">{{ .label }}</a>
        {{- end }}
      </div>
    </details>
    {{- end }}
  </nav>
  <div class="topbar-right">
    <a class="search-link" href="/search/" aria-label="Search">⌕ <span>Search</span></a>
    <button class="icon-btn" aria-label="Toggle dark mode" data-toggle-theme>◐</button>
  </div>
</header>
