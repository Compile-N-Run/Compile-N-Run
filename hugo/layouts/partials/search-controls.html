{{- $prefix := .prefix -}}
<form class="cnr-find__form" data-find-form role="search">
  <label class="cnr-find__label" for="{{ $prefix }}-query">Find a lesson, project, or reference</label>
  <div class="cnr-find__query-row">
    <input id="{{ $prefix }}-query" type="search" name="q" maxlength="200" placeholder="Try “CSS grid” or “Python files”" autocomplete="off" data-find-query>
    <button type="submit" class="button button--primary">Search</button>
  </div>
  <div class="cnr-find__filters">
    <label for="{{ $prefix }}-topic">Topic
      <select id="{{ $prefix }}-topic" name="topic" data-find-topic>
        <option value="">All topics</option>
        <option value="fundamental">CS fundamentals</option><option value="language">Languages</option>
        <option value="framework">Frameworks</option><option value="library">Libraries</option>
        <option value="devops">DevOps</option><option value="database">Databases</option>
        <option value="middleware">Middleware</option><option value="observability">Observability</option>
        <option value="os">Operating systems</option><option value="ai">AI</option><option value="iot">IoT</option>
      </select>
    </label>
    <label for="{{ $prefix }}-course">Course
      <select id="{{ $prefix }}-course" name="course" data-find-course>
        <option value="">All courses</option>
        {{- range sort site.Data.tutorials "label" }}<option value="{{ .dir }}" data-topic="{{ .group }}">{{ strings.TrimSuffix " Tutorial" .label }}</option>{{ end }}
      </select>
    </label>
    <label for="{{ $prefix }}-type">Content
      <select id="{{ $prefix }}-type" name="type" data-find-type>
        <option value="">All content</option><option>Lesson</option><option>Project</option><option>Reference</option>
        <option>Course overview</option><option>Chapter overview</option><option>Article</option><option>Tool</option>
      </select>
    </label>
  </div>
  <div class="cnr-find__actions"><button type="button" class="clean-btn cnr-find__clear" data-find-clear>Clear filters</button><a href="/search/" data-find-link>Open search page</a></div>
</form>
<p class="cnr-find__status" role="status" aria-live="polite" data-find-status>Search all courses, or choose a course to browse its content.</p>
<ol class="cnr-find__results" data-find-results aria-label="Search results"></ol>
<button type="button" class="button button--secondary" data-find-more hidden>Show more results</button>
<noscript><p>Search needs JavaScript. Browse the <a href="/roadmap/">learning roadmaps</a> instead.</p></noscript>
