<ul>
  {{- range .Pages.ByWeight }}
  {{- $label := .Params.sidebar_label | default .Title }}
  {{- if .IsSection }}
  <li class="cat">
    <details>
      <summary>{{ if .RelPermalink }}<a href="{{ .RelPermalink }}">{{ $label }}</a>{{ else }}{{ $label }}{{ end }}</summary>
      {{ partial "tree.html" . }}
    </details>
  </li>
  {{- else }}
  <li><a href="{{ .RelPermalink }}">{{ $label }}</a></li>
  {{- end }}
  {{- end }}
</ul>
