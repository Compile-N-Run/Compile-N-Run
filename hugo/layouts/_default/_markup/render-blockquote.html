{{- /* GitHub-style alerts (> [!TIP]) are what convert.py turns Docusaurus admonitions into. */ -}}
{{- if eq .Type "alert" -}}
{{- $type := lower .AlertType -}}
<div class="admonition admonition-{{ $type }}">
  <div class="admonition-title">{{ with .AlertTitle }}{{ . }}{{ else }}{{ title $type }}{{ end }}</div>
  {{ .Text }}
</div>
{{- else -}}
<blockquote>{{ .Text }}</blockquote>
{{- end -}}
