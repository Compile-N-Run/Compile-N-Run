{{ define "main" }}
<main class="content narrow">
  <h1>Search</h1>
  {{- $b := site.Params.pagefindBundle | default "/pagefind/" }}
  <link href="{{ $b }}pagefind-ui.css" rel="stylesheet">
  <script src="{{ $b }}pagefind-ui.js"></script>
  <div id="search"></div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var ui = new PagefindUI({ element: '#search', bundlePath: '{{ $b }}', showSubResults: true, showImages: false });
      var q = new URLSearchParams(location.search).get('q');
      if (q) ui.triggerSearch(q);
    });
  </script>
</main>
{{ end }}
