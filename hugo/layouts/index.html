{{ define "main" }}
{{- $groups := partialCached "groups.html" . }}
<main class="home">
  <section class="hero">
    <h1>Learn programming for free</h1>
    <p>{{ site.Params.description }}</p>
    <a class="button" href="/search/">Search all tutorials</a>
  </section>
  {{- range $groups }}
  <section class="home-group">
    <h2>{{ .label }}</h2>
    <div class="cards">
      {{- range .tutorials }}
      <a class="card" href="{{ .url }}"><strong>{{ .label }}</strong></a>
      {{- end }}
    </div>
  </section>
  {{- end }}
</main>
{{ end }}
