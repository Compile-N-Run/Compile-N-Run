# Hugo pilot for Compile N Run. Content is generated from ../docs by scripts/convert.py.
baseURL = "https://www.compilenrun.com/"
title = "Compile N Run"
languageCode = "en"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = false
timeout = "120s"

[params]
  description = "Free programming tutorials for beginners: languages, frameworks, databases, DevOps and computer science fundamentals."
  # Preview builds must never be indexed (duplicate content of the live site).
  noindex = true
  # Pagefind index location. On Cloudflare Pages the index is its own project (20k-file limit per deployment).
  pagefindBundle = "https://compile-n-run-hugo-search.pages.dev/pagefind/"

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../static"
    target = "static"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]
  [markup.highlight]
    noClasses = false
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[sitemap]
  changeFreq = ""
  priority = -1
