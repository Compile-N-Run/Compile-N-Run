# Hugo pilot for Compile N Run. Content is generated from ../docs by scripts/convert.py.
baseURL = "https://www.compilenrun.com/"
title = "Compile N Run"
languageCode = "en"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = false
timeout = "120s"

[params]
  description = "Free programming tutorials for beginners: languages, frameworks, databases, DevOps and computer science fundamentals."
  # Set HUGO_PARAMS_NOINDEX=true for staging/preview builds so they are never indexed.
  noindex = false
  # Pagefind index location (built into public/pagefind by scripts/build.sh).
  pagefindBundle = "/pagefind/"
  # Ads and analytics load only in production builds (`hugo`, not `hugo server`).
  gtag = "G-SG8302WY6Z"
  umami = "5cd1a168-25dd-480c-8560-15c0becd3768"
  adsenseClients = ["ca-pub-8558870819217345", "ca-pub-7078440143664316"]
  keywords = "learn programming, programming, python, java, javascript, c, c++, sql, go"
  # Ask AI chat (worker/ask-ai). Override with HUGO_PARAMS_ASKAI_ENDPOINT to point a local build at production.
  [params.askAI]
    endpoint = "/api/ask"
    # Public Turnstile site key (domains: compilenrun.com, localhost); the secret is a Worker secret.
    turnstileSitekey = "0x4AAAAAAFXVJb_GG6mWsgDx"
  # "Was this page helpful?" votes, stored by the same Worker. Override with HUGO_PARAMS_FEEDBACK_ENDPOINT.
  [params.feedback]
    endpoint = "/api/feedback"

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../static"
    target = "static"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        disable = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]
  [markup.highlight]
    noClasses = false
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# Same values as the Docusaurus sitemap plugin config.
[sitemap]
  changeFreq = "daily"
  priority = 0.5

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

# Docusaurus blog feeds: /blog/rss.xml and /blog/atom.xml
[outputFormats.blogrss]
  mediaType = "application/rss+xml"
  baseName = "rss"
  isPlainText = true
  noUgly = true
[outputFormats.blogatom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = true
  noUgly = true
